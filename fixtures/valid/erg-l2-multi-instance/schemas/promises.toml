strict = true

[promises."cfg:slot"]
description = "Per-instance configuration slot"
cardinality = "exclusive"
keyed = false
[promises."cfg:slot".payload]
label = { type = "string", required = true, description = "Instance label" }

[promises."event:stream"]
description = "Broadcast event stream"
cardinality = "broadcast"
keyed = true
default_tags = ["stream"]
[promises."event:stream".payload]
channel = { type = "string", required = true, description = "Channel identifier" }

[promises."quota:units"]
description = "Budgeted capacity units"
cardinality = "budgeted"
keyed = false

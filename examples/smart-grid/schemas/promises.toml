strict = true

[promises."power:kw"]
description = "Electrical power capacity budget in kilowatts (kW)"
cardinality = "budgeted"
keyed = false

[promises."grid:voltage"]
description = "Nominal regulated bus voltage and AC frequency"
cardinality = "exclusive"
keyed = false

[promises."grid:voltage".payload]
volts = { type = "integer", required = true, description = "Nominal bus voltage (V)" }
hz = { type = "integer", required = true, description = "AC frequency (Hz)" }

[promises."breaker:zone"]
description = "Mutually exclusive protection-breaker routing zone"
cardinality = "partitioned"
keyed = true

[promises."breaker:zone".payload]
max_amps = { type = "integer", required = true, description = "Breaker trip threshold (A)" }

[promises."grid:telemetry"]
description = "Broadcast telemetry stream collected by SCADA monitoring"
cardinality = "broadcast"
keyed = true
default_tags = ["telemetry"]

[promises."grid:telemetry".payload]
interval_ms = { type = "integer", required = true, description = "Sampling period (ms)" }

[promises."operator:claim"]
description = "Cedar-governed actuation authority claim"
cardinality = "broadcast"
keyed = true

[promises."grid:summary"]
description = "Aggregated substation health summary exported across superagent boundary"
cardinality = "exclusive"
keyed = false

[promises."grid:summary".payload]
region = { type = "string", required = true, description = "Grid sector identifier" }

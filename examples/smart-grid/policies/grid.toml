[[auth_bindings]]
id = "ab-breaker-actuation"
ptype = "operator:claim"
polarity = "offer"
action = "trip-breaker"
principalFilter = { kind = "atom", tag = "auth:principal" }

[[policies]]
id = "permit-substation-breakers"
effect = "permit"
action = "trip-breaker"
principalPred = { kind = "atom", tag = "role:substation" }
resourcePred = { kind = "atom", tag = "cls:breaker" }

[[policies]]
id = "forbid-auditor-actuation"
effect = "forbid"
action = "trip-breaker"
principalPred = { kind = "atom", tag = "role:auditor" }
resourcePred = { kind = "any" }

[[invariants]]
id = "inv-no-dual-zone-breaker"
ptype = "breaker:zone"
forbidTags = { kind = "inter", left = { kind = "atom", tag = "zone:critical" }, right = { kind = "atom", tag = "zone:auxiliary" } }

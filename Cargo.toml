[package]
name = "baugr"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Formally verified Promise Theory and Semantic Spacetime γ(3,4) algebra"
repository = "https://github.com/LW-54/baugr"
keywords = ["promise-theory", "semantic-spacetime", "formal-methods", "no-std", "graph"]
categories = ["algorithms", "data-structures", "no-std"]

# Zero runtime dependencies — pure #![no_std] + alloc Rust library.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
